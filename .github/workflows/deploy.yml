name: Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Servicio a desplegar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ai-micro
          - crm

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-ai:
    name: Deploy AI Microservice (fitness-ai-micro)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'ai-micro' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ai-micro/package-lock.json'

      - name: Install AI Microservice Dependencies
        working-directory: ./ai-micro
        run: npm ci

      - name: Typecheck AI Microservice
        working-directory: ./ai-micro
        run: npm run typecheck

      - name: Deploy AI Microservice to Cloudflare Workers
        working-directory: ./ai-micro
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-crm:
    name: Deploy Fitness CRM (Root Worker & SPA)
    runs-on: ubuntu-latest
    needs: [ deploy-ai ]
    if: ${{ always() && (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'crm') && (needs.deploy-ai.result == 'success' || needs.deploy-ai.result == 'skipped') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Application (Frontend Assets & Types)
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Fitness CRM to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
