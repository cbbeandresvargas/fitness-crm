name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ai-micro/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install AI Microservice Dependencies
        run: npm --prefix ai-micro ci

      - name: Typecheck TypeScript (Root CRM)
        run: npx tsc --noEmit

      - name: Typecheck TypeScript (AI Microservice)
        run: npm --prefix ai-micro run typecheck

      - name: Build Application (Root CRM)
        run: npm run build

      - name: Run Tests (Vitest)
        run: npm test --if-present
